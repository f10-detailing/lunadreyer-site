<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="sceneTitle" class="poa-scene">
  <title id="sceneTitle">A couple on a video call holding up a power of attorney with an apostille seal, buying a property in Italy</title>
  <style>
    .poa-scene .doc{animation:docUp 8s cubic-bezier(.2,.8,.2,1) infinite}
    .poa-scene .seal{transform-box:fill-box;transform-origin:center;animation:stamp 8s ease-out infinite}
    .poa-scene .ribbon{animation:ribbon 8s ease-out infinite}
    .poa-scene .cap{animation:cap 8s cubic-bezier(.2,.8,.2,1) infinite}
    .poa-scene .live{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}
    .poa-scene .p1{transform-box:fill-box;transform-origin:50% 100%;animation:nod 8s ease-in-out infinite}
    .poa-scene .p2{transform-box:fill-box;transform-origin:50% 100%;animation:nod 8s ease-in-out .35s infinite}
    .poa-scene .self{animation:selfNod 8s ease-in-out infinite}
    @keyframes docUp{0%,4%{transform:translateY(120px);opacity:0}16%{transform:translateY(-4px);opacity:1}20%,86%{transform:translateY(0);opacity:1}96%,100%{transform:translateY(120px);opacity:0}}
    @keyframes stamp{0%,24%{transform:scale(0) rotate(-30deg);opacity:0}30%{transform:scale(1.25) rotate(6deg);opacity:1}34%,86%{transform:scale(1) rotate(0);opacity:1}92%,100%{transform:scale(0);opacity:0}}
    @keyframes ribbon{0%,30%{opacity:0}36%,86%{opacity:1}92%,100%{opacity:0}}
    @keyframes cap{0%,36%{transform:translateY(24px);opacity:0}44%,86%{transform:translateY(0);opacity:1}94%,100%{transform:translateY(24px);opacity:0}}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
    @keyframes nod{0%,38%{transform:translateY(0) rotate(0)}42%{transform:translateY(2px) rotate(-1.5deg)}46%{transform:translateY(0) rotate(0)}50%{transform:translateY(2px) rotate(1deg)}54%,100%{transform:translateY(0) rotate(0)}}
    @keyframes selfNod{0%,58%{transform:translateY(0)}62%{transform:translateY(1.5px)}66%,100%{transform:translateY(0)}}
    @media (prefers-reduced-motion:reduce){
      .poa-scene *{animation:none!important;opacity:1!important}
      .poa-scene .doc,.poa-scene .cap{transform:none!important}
      .poa-scene .seal{transform:none!important}
    }
  </style>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe5d3"/>
      <stop offset="1" stop-color="#dccdb2"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd0e6"/>
      <stop offset="1" stop-color="#e6eef6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3c77d"/>
      <stop offset="1" stop-color="#a8802f"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9dce2"/>
      <stop offset="1" stop-color="#9aa0aa"/>
    </linearGradient>
    <clipPath id="screen"><rect x="42" y="72" width="316" height="206" rx="8"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1220" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- laptop lid -->
  <rect x="30" y="60" width="340" height="230" rx="16" fill="#16181c" filter="url(#soft)"/>
  <circle cx="200" cy="66" r="2" fill="#3a3d44"/>

  <g clip-path="url(#screen)">
    <!-- room behind the couple -->
    <rect x="42" y="72" width="316" height="206" fill="url(#wall)"/>

    <!-- window onto an Italian street -->
    <rect x="236" y="88" width="104" height="92" rx="4" fill="#f7f1e6"/>
    <rect x="242" y="94" width="92" height="80" rx="2" fill="url(#sky)"/>
    <rect x="246" y="128" width="26" height="46" fill="#d9885c"/>
    <rect x="270" y="116" width="30" height="58" fill="#e7b07a"/>
    <rect x="298" y="132" width="34" height="42" fill="#c96e4a"/>
    <path d="M268 116l17-12 17 12z" fill="#b5583a"/>
    <rect x="252" y="138" width="6" height="9" fill="#f6e7d2"/>
    <rect x="262" y="138" width="6" height="9" fill="#f6e7d2"/>
    <rect x="278" y="128" width="6" height="9" fill="#fbefdc"/>
    <rect x="288" y="128" width="6" height="9" fill="#fbefdc"/>
    <rect x="278" y="146" width="6" height="9" fill="#fbefdc"/>
    <rect x="288" y="146" width="6" height="9" fill="#fbefdc"/>
    <rect x="306" y="142" width="7" height="10" fill="#f4d9c2"/>
    <rect x="318" y="142" width="7" height="10" fill="#f4d9c2"/>
    <rect x="287" y="94" width="2" height="80" fill="#f7f1e6"/>
    <rect x="242" y="133" width="92" height="2" fill="#f7f1e6"/>

    <!-- shelf with plant and book -->
    <rect x="56" y="122" width="62" height="4" rx="2" fill="#c7b693"/>
    <rect x="66" y="106" width="14" height="16" rx="3" fill="#8fa8c8"/>
    <path d="M73 106c-8-10-2-18 0-20 2 2 8 10 0 20z" fill="#7d9a74"/>
    <rect x="88" y="108" width="8" height="14" rx="1" fill="#b5583a"/>
    <rect x="97" y="110" width="7" height="12" rx="1" fill="#3d5a80"/>

    <!-- partner 1 (left) -->
    <path d="M86 280c0-44 22-70 64-70s64 26 64 70z" fill="#3d5a80"/>
    <path d="M136 212l14 20 14-20z" fill="#e9eef5"/>
    <rect x="141" y="186" width="18" height="26" rx="8" fill="#d6a283"/>
    <g class="p1">
      <circle cx="150" cy="166" r="27" fill="#e1b294"/>
      <path d="M122 164c0-22 13-33 29-33 17 0 28 11 28 28-8-9-22-12-36-10-8 1-15 6-21 15z" fill="#3b2a22"/>
      <circle cx="140" cy="168" r="2.4" fill="#2b211c"/>
      <circle cx="160" cy="168" r="2.4" fill="#2b211c"/>
      <path d="M143 180c4 4 10 4 14 0" stroke="#9b5f48" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- partner 2 (right) -->
    <path d="M178 280c0-40 20-64 58-64s58 24 58 64z" fill="#b98a5e"/>
    <rect x="227" y="192" width="17" height="26" rx="8" fill="#c99273"/>
    <g class="p2">
      <path d="M206 168c0-24 14-38 31-38 18 0 31 14 31 38v34c-6 4-12 5-17 4l-2-30h-25l-2 30c-6 1-11 0-16-4z" fill="#5a3a28"/>
      <circle cx="236" cy="170" r="25" fill="#d8a688"/>
      <path d="M211 166c3-18 14-27 26-27 13 0 23 9 25 25-11-2-22-8-30-16-5 9-12 15-21 18z" fill="#5a3a28"/>
      <circle cx="227" cy="172" r="2.3" fill="#2b211c"/>
      <circle cx="245" cy="172" r="2.3" fill="#2b211c"/>
      <path d="M229 183c4 4 10 4 14 0" stroke="#9b5f48" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- the power of attorney, held up to the camera -->
    <g class="doc">
      <g transform="rotate(-4 196 238)">
        <rect x="152" y="196" width="92" height="86" rx="3" fill="#fdfcf8" stroke="#e2ddd0"/>
        <rect x="162" y="206" width="54" height="5" rx="2.5" fill="#3d5a80"/>
        <rect x="162" y="217" width="72" height="3" rx="1.5" fill="#c9ccd2"/>
        <rect x="162" y="224" width="66" height="3" rx="1.5" fill="#c9ccd2"/>
        <rect x="162" y="231" width="70" height="3" rx="1.5" fill="#c9ccd2"/>
        <rect x="162" y="238" width="48" height="3" rx="1.5" fill="#c9ccd2"/>
        <path d="M163 258c6-6 10 4 16-2s8-4 12 0" stroke="#2f3b52" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <!-- apostille seal with ribbon -->
        <g class="ribbon">
          <path d="M222 262l-6 18 7-4 4 7 3-16z" fill="#b5583a"/>
          <path d="M232 262l6 18-7-4-4 7-3-16z" fill="#9c4a31"/>
        </g>
        <g class="seal">
          <circle cx="227" cy="256" r="13" fill="url(#gold)"/>
          <circle cx="227" cy="256" r="9.5" fill="none" stroke="#fff3cf" stroke-width="1" stroke-dasharray="2 2"/>
          <path d="M222 256l3.5 3.5 6.5-7" stroke="#fff8e4" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
      <!-- hands holding the document -->
      <ellipse cx="152" cy="246" rx="8" ry="10" fill="#e1b294"/>
      <ellipse cx="246" cy="240" rx="8" ry="10" fill="#d8a688"/>
    </g>

    <!-- self view: the translator -->
    <rect x="284" y="214" width="62" height="48" rx="6" fill="#26292f" stroke="#ffffff" stroke-opacity=".7"/>
    <g class="self">
      <path d="M303 236c0-11 5-17 12-17s12 6 12 17v12h-4v-10h-16v10h-4z" fill="#4a2f22"/>
      <circle cx="315" cy="235" r="8.5" fill="#e6bba0"/>
      <path d="M306.5 233c1-6 4.5-9 8.5-9s7.5 3 8.5 9c-3-2-6-3-8.5-5-2.5 2-5.5 3-8.5 5z" fill="#4a2f22"/>
      <circle cx="312" cy="236" r="1.2" fill="#2b211c"/>
      <circle cx="318" cy="236" r="1.2" fill="#2b211c"/>
      <path d="M300 262c0-12 7-18 15-18s15 6 15 18z" fill="#f2f2ef"/>
    </g>

    <!-- call status -->
    <rect x="62" y="252" width="62" height="18" rx="9" fill="#16181c" fill-opacity=".72"/>
    <circle class="live" cx="74" cy="261" r="3" fill="#e5484d"/>
    <text x="82" y="264.5" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#ffffff">Live call</text>
  </g>

  <!-- laptop base -->
  <path d="M8 292h384l-10 14c-2 3-6 5-10 5H28c-4 0-8-2-10-5z" fill="url(#base)"/>
  <rect x="170" y="292" width="60" height="5" rx="2.5" fill="#868c96"/>

  <!-- caption chip -->
  <g class="cap">
    <g filter="url(#soft)"><rect x="80" y="346" width="240" height="44" rx="12" fill="#ffffff"/></g>
    <circle cx="104" cy="368" r="10" fill="url(#gold)"/>
    <path d="M99.5 368l3 3 6-6.5" stroke="#fff8e4" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="122" y="365" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#111214">Power of attorney</text>
    <text x="122" y="380" font-family="Inter,system-ui,sans-serif" font-size="10.5" fill="#5d6168">Translated and apostilled for Italy</text>
  </g>
</svg>
